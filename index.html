<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Department Calendar</title>
<meta name="theme-color" content="#123a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Department Calendar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='10' fill='%23123a5e'/%3E%3Crect x='6' y='10' width='52' height='14' rx='7' fill='%232f7fd0'/%3E%3Ccircle cx='22' cy='38' r='5' fill='%23fff'/%3E%3Ccircle cx='42' cy='38' r='5' fill='%23f2b134'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#15212e; --muted:#5d6b7a; --line:#e2e7ee;
  --brand:#123a5e; --brand2:#2f7fd0; --today:#2f7fd0; --weekend:#f8f9fb;
  --c-director:#d93a3a; --c-cdp:#2e74d6; --c-ncd:#8a4fd6; --c-surv:#e8802a;
  --c-ipc:#d9488f; --c-hp:#2f9d5a; --c-ohs:#d9a714; --c-general:#7b8794;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}

header.top{background:var(--brand);color:#fff;padding:18px 0 16px;padding-top:max(18px,env(safe-area-inset-top))}
header .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
.brand .ar{direction:rtl;font-size:15px;opacity:.85;margin-top:2px}
.updated{font-size:13px;opacity:.8}

.toolbar{display:flex;align-items:center;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.toolbar h2{margin:0 8px 0 4px;font-size:22px;font-weight:700;min-width:170px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:#c5cfdb}
.btn.icon{padding:8px 11px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;cursor:pointer;user-select:none}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.4}
.chip.off .dot{background:#bbb!important}

.layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* month */
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dow div{padding:10px 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;background:var(--surface);min-width:0}
.day:nth-child(7n){border-right:0}
.day.wk{background:var(--weekend)}
.day.out .num{color:#b3bcc7}
.day:hover{background:#f1f6fd}
.day.sel{box-shadow:inset 0 0 0 2px var(--brand2)}
.num{font-size:13px;font-weight:600;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.today .num{background:var(--today);color:#fff}
.ev{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.25;padding:3px 6px;border-radius:6px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.ev b{font-weight:700;color:var(--c);flex:none}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev.allday{background:var(--c);color:#fff}
.ev.allday b{color:#fff}
.more{font-size:11.5px;color:var(--muted);margin-top:3px;padding-left:4px;font-weight:500}
.dots{display:none;gap:3px;flex-wrap:wrap;margin-top:4px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* side panel */
.side{position:sticky;top:12px;padding:16px}
.side h3{margin:0 0 2px;font-size:17px}
.side .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.item{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item .tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);border-radius:6px;padding:1px 7px;margin-bottom:4px}
.item .t{font-weight:600;font-size:15px;line-height:1.35;unicode-bidi:plaintext}
.item .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-direction:column;gap:2px}
.item .desc{font-size:13px;margin-top:6px;white-space:pre-wrap;color:#334;unicode-bidi:plaintext;max-height:180px;overflow:auto}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}

/* list */
.list{padding:6px 16px 16px}
.dayhead{font-weight:700;font-size:14px;margin:16px 0 8px;color:var(--brand);display:flex;gap:8px;align-items:baseline}
.dayhead small{color:var(--muted);font-weight:500}
.dayhead.today::after{content:"Today";font-size:11px;background:var(--today);color:#fff;border-radius:6px;padding:1px 7px}

.status{padding:40px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px;line-height:1.7}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:640px){
  .wrap{padding:0 12px 32px}
  .brand h1{font-size:19px}
  .toolbar h2{font-size:19px;min-width:0;flex:1}
  .seg{margin-left:0;width:100%}
  .seg button{flex:1}
  .day{min-height:58px;padding:4px 2px;text-align:center}
  .num{margin:0 auto;font-size:13px}
  .ev,.more{display:none}
  .dots{display:flex}
  .dow div{text-align:center;padding:8px 0;font-size:11px}
  .legend{gap:5px}
  .chip{font-size:12px;padding:4px 9px 4px 7px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Department Calendar</h1>
      <div class="ar">تقويم دائرة مراقبة الأمراض والوقاية منها</div>
    </div>
    <div class="updated" id="updated"></div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <button class="btn icon" id="prev" aria-label="Previous">‹</button>
    <button class="btn icon" id="next" aria-label="Next">›</button>
    <button class="btn" id="todayBtn">Today</button>
    <h2 id="title"></h2>
    <div class="seg" role="tablist">
      <button id="vMonth" class="on">Month</button>
      <button id="vList">Upcoming</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="layout" id="layout">
    <section class="card" id="main"><div class="status">Loading…</div></section>
    <aside class="card side" id="side"></aside>
  </div>

  <footer>
    Check the calendar before booking any date · To add an event, contact Maryam Al Wahaibi<br>
    تصميم: عتاب بنت سعيد الحبسية / Atab Said Al Habsi
  </footer>
</main>

<script>
const SECTIONS = [
  {key:"Director",     name:"Director",                       re:/^director\b/i,      c:"var(--c-director)"},
  {key:"CDP",          name:"Communicable Disease Prevention",re:/^cdp\b/i,           c:"var(--c-cdp)"},
  {key:"NCD",          name:"Non-Communicable Diseases",      re:/^ncd\b/i,           c:"var(--c-ncd)"},
  {key:"Surveillance", name:"Integrated Surveillance",        re:/^surveillance\b/i,  c:"var(--c-surv)"},
  {key:"IPC",          name:"Infection Prevention & Control", re:/^ipc\b/i,           c:"var(--c-ipc)"},
  {key:"HP",           name:"Health Promotion",               re:/^(hp|health promotion)\b/i, c:"var(--c-hp)"},
  {key:"OHS",          name:"Occupational Health & Safety",   re:/^ohs\b/i,           c:"var(--c-ohs)"},
  {key:"General",      name:"General",                        re:/^general\b/i,       c:"var(--c-general)"},
];
const OTHER = {key:"Other", name:"Other", c:"var(--c-general)"};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WEEKEND = [5,6]; // Fri, Sat

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYMD = s => { const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
// "Today" in Oman time, whatever the viewer's device zone
const omanToday = () => new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Muscat"}));

let EVENTS = [], hidden = new Set(), view = "month";
let cursor = omanToday(); cursor.setDate(1);
let selected = ymd(omanToday());

function classify(raw){
  // strip leading emoji / symbols, then read the section code before "|"
  const clean = raw.replace(/^[^A-Za-z؀-ۿ]+/u, "").trim();
  for (const s of SECTIONS){
    if (s.re.test(clean)){
      const rest = clean.replace(s.re, "").replace(/^\s*[|:\-–]\s*/, "").trim();
      return {sec:s, label: rest || clean};
    }
  }
  return {sec:OTHER, label: clean || raw};
}

function fmtTime(iso){
  const h = Number(iso.slice(11,13)), m = iso.slice(14,16);
  const ap = h >= 12 ? "PM" : "AM", hh = ((h + 11) % 12) + 1;
  return `${hh}:${m} ${ap}`;
}
function fmtDate(d, withYear){
  return `${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${withYear ? " " + d.getFullYear() : ""}`;
}

function prepare(list){
  return list.map(e => {
    const {sec,label} = classify(e.title || "");
    const s = e.start.slice(0,10);
    let en = (e.end || e.start).slice(0,10);
    // timed event ending exactly at midnight belongs to the previous day
    if (!e.allDay && en > s && (e.end||"").slice(11,16) === "00:00"){
      const d = parseYMD(en); d.setDate(d.getDate()-1); en = ymd(d);
    }
    if (en < s) en = s;
    return {...e, sec, label, sDay:s, eDay:en};
  });
}

const visible = () => EVENTS.filter(e => !hidden.has(e.sec.key));
const onDay = day => visible().filter(e => e.sDay <= day && e.eDay >= day)
  .sort((a,b) => (b.allDay - a.allDay) || a.start.localeCompare(b.start));

function renderLegend(){
  const used = new Set(EVENTS.map(e => e.sec.key));
  const list = [...SECTIONS, ...(used.has("Other") ? [OTHER] : [])];
  $("#legend").innerHTML = list.map(s =>
    `<span class="chip ${hidden.has(s.key) ? "off" : ""}" data-k="${s.key}" title="${esc(s.name)}"><span class="dot" style="background:${s.c}"></span>${esc(s.key === "HP" ? "Health Promotion" : s.key)}</span>`
  ).join("");
  $("#legend").querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    const k = ch.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k); render();
  });
}

function evRow(e){
  const time = e.allDay ? "" : fmtTime(e.start) + " ";
  return `<div class="ev ${e.allDay ? "allday" : ""}" style="--c:${e.sec.c}" title="${esc(e.title)}"><b>${esc(e.sec.key === "Other" ? "" : e.sec.key)}</b><span>${esc(time + e.label)}</span></div>`;
}

function renderMonth(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $("#title").textContent = `${MONTHS[m]} ${y}`;
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const today = ymd(omanToday());
  const weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate()) / 7);
  let cells = "";
  for (let i = 0; i < weeks * 7; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d), evs = onDay(key);
    const cls = ["day", d.getMonth() !== m && "out", WEEKEND.includes(d.getDay()) && "wk", key === today && "today", key === selected && "sel"].filter(Boolean).join(" ");
    const shown = evs.slice(0, 3).map(evRow).join("");
    const more = evs.length > 3 ? `<div class="more">+${evs.length - 3} more</div>` : "";
    const dots = evs.slice(0, 6).map(e => `<i style="--c:${e.sec.c}"></i>`).join("");
    cells += `<div class="${cls}" data-d="${key}"><div class="num">${d.getDate()}</div>${shown}${more}<div class="dots">${dots}</div></div>`;
  }
  $("#main").innerHTML = `<div class="dow">${DOW.map(d => `<div>${d}</div>`).join("")}</div><div class="grid">${cells}</div>`;
  $("#main").querySelectorAll(".day").forEach(c => c.onclick = () => {
    selected = c.dataset.d;
    const d = parseYMD(selected);
    if (d.getMonth() !== cursor.getMonth()){ cursor = new Date(d.getFullYear(), d.getMonth(), 1); }
    render();
    if (window.innerWidth <= 900) $("#side").scrollIntoView({behavior:"smooth", block:"start"});
  });
}

function itemCard(e, showDate){
  const d1 = parseYMD(e.sDay), d2 = parseYMD(e.eDay);
  let when;
  if (e.allDay) when = e.sDay === e.eDay ? "All day" : `All day · ${fmtDate(d1)} – ${fmtDate(d2)}`;
  else {
    when = `${fmtTime(e.start)} – ${fmtTime(e.end || e.start)}`;
    if (e.sDay !== e.eDay) when = `${fmtDate(d1)} ${fmtTime(e.start)} – ${fmtDate(d2)} ${fmtTime(e.end)}`;
  }
  if (showDate && e.sDay === e.eDay) when = `${fmtDate(d1)} · ${when}`;
  return `<div class="item" style="--c:${e.sec.c}">
    ${e.sec.key !== "Other" ? `<span class="tag">${esc(e.sec.name)}</span>` : ""}
    <div class="t">${esc(e.label)}</div>
    <div class="meta"><span>🕒 ${esc(when)}</span>${e.location ? `<span>📍 ${esc(e.location)}</span>` : ""}</div>
    ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
  </div>`;
}

function renderSide(){
  const d = parseYMD(selected), evs = onDay(selected);
  $("#side").innerHTML = `<h3>${fmtDate(d, true)}</h3>
    <div class="sub">${evs.length ? `${evs.length} event${evs.length > 1 ? "s" : ""}` : "Nothing scheduled — this date is free"}</div>
    ${evs.map(e => itemCard(e)).join("")}`;
}

function renderList(){
  $("#title").textContent = "Upcoming";
  const today = ymd(omanToday());
  const up = visible().filter(e => e.eDay >= today).sort((a,b) => a.sDay.localeCompare(b.sDay) || (b.allDay - a.allDay) || a.start.localeCompare(b.start));
  if (!up.length){ $("#main").innerHTML = `<div class="empty">No upcoming events.</div>`; return; }
  let html = "", last = "";
  for (const e of up.slice(0, 120)){
    const day = e.sDay < today ? today : e.sDay;
    if (day !== last){
      const d = parseYMD(day);
      html += `<div class="dayhead ${day === today ? "today" : ""}">${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} <small>${d.getFullYear()}</small></div>`;
      last = day;
    }
    html += itemCard(e);
  }
  $("#main").innerHTML = `<div class="list">${html}</div>`;
}

function render(){
  renderLegend();
  $("#vMonth").classList.toggle("on", view === "month");
  $("#vList").classList.toggle("on", view === "list");
  ["#prev","#next"].forEach(s => $(s).style.visibility = view === "month" ? "visible" : "hidden");
  $("#side").style.display = view === "month" ? "" : "none";
  $("#layout").style.gridTemplateColumns = view === "month" ? "" : "1fr";
  if (view === "month"){ renderMonth(); renderSide(); } else renderList();
}

$("#prev").onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1); render(); };
$("#next").onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1); render(); };
$("#todayBtn").onclick = () => { const t = omanToday(); cursor = new Date(t.getFullYear(), t.getMonth(), 1); selected = ymd(t); view = "month"; render(); };
$("#vMonth").onclick = () => { view = "month"; render(); };
$("#vList").onclick = () => { view = "list"; render(); };

// swipe left/right on phones to change month
let tx = null;
$("#main").addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive:true});
$("#main").addEventListener("touchend", e => {
  if (tx === null || view !== "month") return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) (dx < 0 ? $("#next") : $("#prev")).click();
}, {passive:true});

async function load(){
  try{
    const r = await fetch("data/events.json?t=" + Date.now(), {cache:"no-store"});
    const data = await r.json();
    EVENTS = prepare(data.events || []);
    if (data.updated){
      const u = data.updated;
      $("#updated").textContent = `Updated ${Number(u.slice(8,10))} ${MONTHS[Number(u.slice(5,7))-1].slice(0,3)}, ${fmtTime(u)}`;
    }
    render();
  }catch(err){
    $("#main").innerHTML = `<div class="status">Could not load the calendar. Please refresh the page.</div>`;
  }
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
